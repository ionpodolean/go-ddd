receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  resource:
    attributes:
      - key: service.name
        action: upsert
        from_attribute: service.name

exporters:
  # Prometheus exporter for metrics (scraped by Prometheus)
  prometheus:
    endpoint: "0.0.0.0:8889"
    resource_to_telemetry_conversion:
      enabled: true

  # OTLP exporter to Tempo for traces
  otlp_grpc/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

  # Loki 3+ natively ingests OTLP logs. The legacy `loki` collector exporter
  # was removed from recent OpenTelemetry Collector Contrib images.
  otlp_http/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true

  # Debug exporter to stdout (useful for dev troubleshooting)
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlp_http/loki, debug]

  telemetry:
    logs:
      level: info
