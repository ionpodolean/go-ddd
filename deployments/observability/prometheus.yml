global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape metrics from the OpenTelemetry Collector's Prometheus exporter
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          source: "otel-collector"

  # Scrape Prometheus metrics directly from the Go app's /metrics endpoint
  - job_name: "go-ddd-app"
    static_configs:
      - targets: ["app:8080"]
        labels:
          source: "go-ddd-app"
    metrics_path: "/metrics"
